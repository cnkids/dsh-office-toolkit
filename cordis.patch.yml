# dsh-office-toolkit bundle patch: inserts the host-only tool plugin row into the
# profile roster (the config-tree root IS the plugin list). Host-only: the package
# declares no `dsh.client` half, so nothing is served to the browser.
#
# Activate with:
#   dsh plugin --profile web add dsh-office-toolkit
# (`dsh plugin add` registers the name in dsh.profile.bundles automatically;
#  restart `dsh web` afterwards.)
- insert:
    - id: dsh-office-toolkit
      name: 'dsh-office-toolkit'
